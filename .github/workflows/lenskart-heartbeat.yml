name: Lenskart brief heartbeat (demo)
# Demo only: proves the scheduler is alive by emailing the repo owner every 30 seconds.
# GitHub's fastest schedule is every 5 minutes, so each run sends 10 pings 30 seconds apart.
# Each ping is a comment on the open leadership-brief issue; GitHub emails it to the owner.
# Switches itself off after STOP_AFTER (IST).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: lenskart-heartbeat
env:
  STOP_AFTER: "2026-11-23 12:00"
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping every 30 seconds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          now=$(TZ=Asia/Kolkata date +"%Y-%m-%d %H:%M")
          if [[ "$now" > "$STOP_AFTER" ]]; then echo "Demo window over ($now IST)"; exit 0; fi
          issue=$(gh issue list -R "$REPO" --label leadership-brief --state open --json number -q '.[0].number')
          title=$(gh issue view "$issue" -R "$REPO" --json title -q .title)
          for i in $(seq 1 10); do
            t=$(TZ=Asia/Kolkata date +"%H:%M:%S")
            gh issue comment "$issue" -R "$REPO" --body "💓 Heartbeat ${i}/10 from the ${{ github.event_name }} run at **${t} IST**. The scheduler is alive.

          Latest brief: ${title}
          Tracker: https://www.kliquestart.com/lenskart-tracker/

          cc @${OWNER} · demo pings stop after ${STOP_AFTER} IST"
            echo "sent $i at $t"
            [ "$i" -lt 10 ] && sleep 30
          done
